[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dax-parity"
dynamic = ["version"]
description = "Differential testing for Power BI: every DAX measure checked cell by cell against an independent SQL reference, on Power BI's own engine."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Ney Fred Jiménez Campos", email = "neyfred@gmail.com" }]
keywords = ["power-bi", "dax", "testing", "tmdl", "pbip", "semantic-model", "duckdb", "data-quality"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
  "Topic :: Database",
  "Intended Audience :: Developers",
]
dependencies = ["duckdb>=1.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/jmnzcn/dax-parity"
Issues = "https://github.com/jmnzcn/dax-parity/issues"

[project.scripts]
dax-parity = "dax_parity.cli:main"

[tool.hatch.version]
path = "src/dax_parity/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/dax_parity"]

[tool.hatch.build.targets.wheel.force-include]
"src/dax_parity/runner/DaxRunner.csproj" = "dax_parity/runner/DaxRunner.csproj"
"src/dax_parity/runner/Program.cs" = "dax_parity/runner/Program.cs"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.hatch.build.targets.sdist]
exclude = ["examples", "docs", ".github"]
