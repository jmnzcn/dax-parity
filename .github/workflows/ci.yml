name: ci

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

  example:
    # What a team would run on its own model: validate the TMDL with Microsoft's Tabular Object
    # Model, then compare the results recorded in Power BI Desktop with the SQL reference.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: pip install -e .
      - run: dax-parity validate
        working-directory: examples/recovery-bi
      - run: dax-parity check --junit parity.junit.xml
        working-directory: examples/recovery-bi
      - name: the same results against the references Claude drafted
        run: dax-parity check --drafts dax-parity.drafts.toml
        working-directory: examples/recovery-bi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parity-report
          path: examples/recovery-bi/parity.junit.xml
